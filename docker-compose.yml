services:
  db:
    image: postgis/postgis:16-3.4
    container_name: vn_gis_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis}
      POSTGRES_USER: ${POSTGRES_USER:-docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docker} -d ${POSTGRES_DB:-gis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vn_gis_network

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: vn_gis_martin
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docker}:${POSTGRES_PASSWORD:-docker}@db:5432/${POSTGRES_DB:-gis}
    command:
      - --config=/app/config.yaml
      - --webui=enable-for-all
    volumes:
      - ./martin/config.yaml:/app/config.yaml:ro
    ports:
      - "${MARTIN_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vn_gis_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vn_gis_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docker}:${POSTGRES_PASSWORD:-docker}@db:5432/${POSTGRES_DB:-gis}
      MARTIN_URL: http://martin:3000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vn_gis_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vn_gis_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_MARTIN_URL: http://localhost:3000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - martin
    networks:
      - vn_gis_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vn_gis_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    networks:
      - vn_gis_network

volumes:
  postgis_data:

networks:
  vn_gis_network:
    driver: bridge
